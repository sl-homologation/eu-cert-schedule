<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>유럽 인증 일정 - 운영 정지</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f3f4f7;font-family:"Malgun Gothic","맑은 고딕",Arial,sans-serif;color:#1c2330;padding:16px;box-sizing:border-box}
  .card{background:#fff;max-width:440px;width:100%;border-radius:12px;padding:32px 28px;box-shadow:0 6px 24px rgba(0,0,0,.08);text-align:center}
  h1{font-size:20px;margin:0 0 6px}
  .sub{color:#6b7380;font-size:13px;margin:0 0 22px}
  .msg{font-size:15px;line-height:1.6;margin:0;padding:16px;border-radius:8px;background:#fdf1f0;color:#b3261e;font-weight:700}
</style>
</head>
<body>
  <div class="card">
    <h1>유럽 인증 일정</h1>
    <p class="sub">Regulation &amp; Homologation Team</p>
    <p class="msg">해당 사이트는 보안 상의 문제로<br>운영이 정지되었습니다.</p>
  </div>
</body>
</html>
