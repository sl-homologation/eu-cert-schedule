<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>유럽 인증 일정</title>
<style>
:root{
  --bg:#f3f5f8; --card:#fff; --line:#d5dae2; --head:#c9d3e3; --text:#1c2330; --muted:#7c8696;
  --sun:#e0262b; --sat:#1f5fd6; --accent:#1f4e9c; --block:#5cb85c; --sel:rgba(31,78,156,.16); --today:#fff7d6;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:var(--bg);color:var(--text);font-size:14px}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

/* ---------- 로그인 ---------- */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.login-card{background:var(--card);width:100%;max-width:360px;border-radius:12px;padding:28px 24px;box-shadow:0 6px 24px rgba(0,0,0,.08)}
.login-card h1{font-size:20px;margin:0 0 4px}
.login-card p{margin:0 0 18px;color:var(--muted);font-size:13px}
.login-card label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
.login-card input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px}
.login-card .btn{width:100%;margin-top:18px;padding:11px}
.err{color:var(--sun);font-size:13px;margin-top:10px;min-height:18px}
.demo-hint{margin-top:14px;background:#eef3fb;border-radius:8px;padding:10px 12px;font-size:12.5px;line-height:1.6;color:#33445e}

/* ---------- 공통 버튼 ---------- */
.btn{border:0;border-radius:8px;padding:8px 14px;background:var(--accent);color:#fff;font-weight:600}
.btn.ghost{background:#fff;color:var(--text);border:1px solid var(--line)}
.btn.danger{background:#fff;color:var(--sun);border:1px solid #f0b9bb}
.btn.sm{padding:5px 10px;font-size:12.5px}

/* ---------- 상단 ---------- */
#app{max-width:1400px;margin:0 auto;padding:16px}
.topbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
.who{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.who b{color:var(--text)}
.mode-badge{background:#fff2cc;color:#7a5a00;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700}
.actions{display:flex;flex-wrap:wrap;gap:6px}

.sheet{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 18px 14px}
.sheet-head{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:12px}
.title{display:flex;align-items:center;gap:10px}
.title h2{margin:0;font-size:24px;letter-spacing:-.5px}
.nav{display:flex;gap:4px}
.nav button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:5px 10px}
.view-toggle{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.view-toggle button{border:0;background:#fff;padding:6px 12px}
.view-toggle button.on{background:var(--accent);color:#fff}

/* ---------- 필터 ---------- */
.filters{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;justify-content:flex-end;margin-bottom:10px}
.fgroup{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.fgroup > span{font-weight:700;font-size:13px;margin-right:2px}
.chip{border:2px solid transparent;border-radius:3px;padding:4px 12px;font-size:14px;background:#e9edf3;color:var(--text)}
.chip.off{opacity:.28}
.chip.plain{background:#fff;border-color:var(--line);border-width:1px;font-size:13px;padding:4px 10px}
.chip.plain.on{border-color:var(--accent);color:var(--accent);font-weight:700}
.reset{font-size:12px;color:var(--muted);background:none;border:0;text-decoration:underline}

/* ---------- 달력 ---------- */
.cal-wrap{overflow-x:auto}
#cal{min-width:760px;border:1px solid var(--line);border-right:0;user-select:none}
.dow{display:grid;grid-template-columns:repeat(7,1fr);background:var(--head)}
.dow div{text-align:center;font-size:22px;padding:6px 0;border-right:1px solid #fff;color:#fff;font-weight:600}
.dow .s{color:var(--sun)} .dow .t{color:var(--sat)}
.week{display:grid;grid-template-columns:repeat(7,1fr);row-gap:3px;border-top:1px solid var(--line);min-height:116px;position:relative}
.cell{grid-row:1/-1;border-right:1px solid var(--line);padding:5px 8px;position:relative;cursor:default}
.cell.admin{cursor:crosshair}
.cell.out{background:#fafbfc}
.cell.today{background:var(--today)}
.cell.blocked{background:var(--block)}
.cell.sel{background:var(--sel)!important}
.dnum{font-weight:700;font-size:15px}
.cell.out .dnum{color:var(--muted)}
.cell.sun .dnum,.cell.hol .dnum{color:var(--sun)}
.cell.sat .dnum{color:var(--sat)}
.cell.out.sun .dnum,.cell.out.hol .dnum,.cell.out.sat .dnum{opacity:.55}
.hname{font-size:11px;color:var(--sun);margin-left:4px;font-weight:600}
.blabel{position:absolute;left:8px;bottom:6px;font-size:12px;color:#fff;font-weight:700}
.bar{z-index:1;margin:0 3px;height:22px;line-height:22px;font-size:12.5px;font-weight:700;padding:0 6px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:4px;cursor:pointer;box-shadow:0 1px 0 rgba(0,0,0,.12)}
.bar:hover{filter:brightness(.95)}
.bar.cl{margin-left:0;border-top-left-radius:0;border-bottom-left-radius:0}
.bar.cr{margin-right:0;border-top-right-radius:0;border-bottom-right-radius:0}
.cc{display:inline-block;font-size:10.5px;line-height:15px;padding:0 5px;border-radius:8px;background:#1c2330;color:#fff;margin-left:6px;vertical-align:1px}
.thread{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
.thread h4{margin:0 0 10px;font-size:14px}
.cmt{padding:9px 11px;border-radius:8px;background:#f4f6f9;margin-bottom:8px}
.cmt.ext{background:#eef5ff}
.cmt .meta{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center}
.cmt .meta b{color:var(--text)}
.cmt .meta button{margin-left:auto;border:0;background:none;color:var(--muted);font-size:12px;text-decoration:underline;padding:0}
.cmt .body{margin-top:4px;white-space:pre-wrap;word-break:break-word;font-size:13.5px;line-height:1.5}
.cform{display:grid;grid-template-columns:140px 1fr auto;gap:8px;margin-top:6px}
.cform input,.cform textarea{padding:8px 10px;border:1px solid var(--line);border-radius:7px;font:inherit}
.cform textarea{min-height:40px;resize:vertical}
.newtag{font-size:10.5px;color:#fff;background:var(--sun);border-radius:3px;padding:0 4px}
@media (max-width:640px){.cform{grid-template-columns:1fr}}
.tb{display:inline-block;font-size:10.5px;line-height:15px;padding:0 5px;border-radius:3px;background:rgba(255,255,255,.75);color:#222;margin-right:5px;vertical-align:1px}

/* ---------- 목록 ---------- */
table.list{width:100%;border-collapse:collapse;font-size:13.5px}
table.list th,table.list td{border-bottom:1px solid var(--line);padding:8px 8px;text-align:left;vertical-align:top}
table.list th{background:#f2f4f8;font-size:12.5px;color:#4a5465}
table.list tr.click{cursor:pointer}
table.list tr.click:hover td{background:#f7f9fc}
.dot{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.empty{padding:28px;text-align:center;color:var(--muted)}

/* ---------- 모달 ---------- */
.overlay{position:fixed;inset:0;background:rgba(15,20,30,.4);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;z-index:50;overflow:auto}
.modal{background:#fff;border-radius:12px;width:100%;max-width:520px;padding:20px 22px;box-shadow:0 10px 40px rgba(0,0,0,.2)}
.modal.wide{max-width:820px}
.modal h3{margin:0 0 14px;font-size:18px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.form .full{grid-column:1/-1}
.form label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.form input,.form select,.form textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:#fff}
.form textarea{min-height:64px;resize:vertical}
.mfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.mfoot .left{margin-right:auto}
.kv{display:grid;grid-template-columns:90px 1fr;gap:8px 12px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600}
.small{font-size:12px;color:var(--muted)}

@media (max-width:640px){
  .form{grid-template-columns:1fr}
  .title h2{font-size:20px}
  .filters{justify-content:flex-start}
}
@media print{
  @page{size:A4 landscape;margin:8mm}
  body{background:#fff}
  .topbar,.view-toggle,.nav,.reset,.overlay{display:none!important}
  #app{padding:0;max-width:none}
  .sheet{border:0;padding:0}
  .chip.off{display:none}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #cal{min-width:0}
}
</style>
</head>
<body>

<!-- ================= 로그인 ================= -->
<div id="login" class="hidden">
  <form class="login-card" id="loginForm" autocomplete="on">
    <h1>유럽 인증 일정</h1>
    <p>Regulation &amp; Homologation Team</p>
    <label for="lid">아이디</label>
    <input id="lid" autocomplete="username" required>
    <label for="lpw">비밀번호</label>
    <input id="lpw" type="password" autocomplete="current-password" required>
    <button class="btn" type="submit" id="loginBtn">로그인</button>
    <div class="err" id="loginErr"></div>
    <div style="text-align:right;margin-top:-4px"><a href="#" id="forgotPw" style="font-size:12px;color:var(--muted)">비밀번호 변경 / 찾기</a></div>
    <div class="demo-hint hidden" id="demoHint">
      <b>데모 모드</b> (Firebase 미연결, 데이터는 새로고침하면 초기화)<br>
      아이디 <b>team</b> = 우리팀(관리자) · <b>sud</b> = TÜV SÜD · <b>rheinland</b> = TÜV Rheinland<br>
      비밀번호는 아무거나 입력
    </div>
  </form>
</div>

<!-- ================= 본 화면 ================= -->
<div id="app" class="hidden">
  <div class="topbar">
    <div class="who">
      <span id="modeBadge" class="mode-badge hidden">데모 모드</span>
      <span>접속: <b id="whoLabel"></b></span>
      <span id="workerWrap" class="hidden">· 작업자
        <select id="worker" class="chip plain" style="padding:3px 6px"></select>
      </span>
    </div>
    <div class="actions">
      <button class="btn sm admin-only" id="btnAdd">+ 일정 추가</button>
      <button class="btn ghost sm admin-only" id="btnBlocks">휴무 관리</button>
      <button class="btn ghost sm admin-only" id="btnTrash">휴지통</button>
      <button class="btn ghost sm admin-only" id="btnHistory">변경 이력</button>
      <button class="btn ghost sm" id="btnComments">댓글</button>
      <button class="btn ghost sm" id="btnPrint">인쇄 / PDF</button>
      <button class="btn ghost sm" id="btnLogout">로그아웃</button>
    </div>
  </div>

  <div class="sheet">
    <div class="sheet-head">
      <div class="title">
        <div class="nav">
          <button id="prev" aria-label="이전 달">◀</button>
          <button id="today">오늘</button>
          <button id="next" aria-label="다음 달">▶</button>
        </div>
        <h2 id="title"></h2>
      </div>
      <div class="view-toggle">
        <button data-view="month" class="on">달력</button>
        <button data-view="list">목록</button>
      </div>
    </div>

    <div class="filters" id="filters"></div>
    <div id="viewMonth" class="cal-wrap"><div id="cal"></div></div>
    <div id="viewList" class="hidden"></div>
    <div class="small admin-only" style="margin-top:8px">달력 빈 칸을 클릭하거나 여러 날을 드래그하면 일정을 추가할 수 있습니다. 막대를 클릭하면 상세·댓글을 보고 수정할 수 있습니다.</div>
  </div>
</div>

<div id="modalRoot"></div>

<script>
/* =====================================================================
   1) 설정 — 여기만 고치면 됩니다
   ===================================================================== */
const CONFIG = {
  // Firebase 연결 정보. 비워두면(null) 데모 모드로 동작합니다.
  // Firebase 콘솔 > 프로젝트 설정 > 내 앱 > SDK 설정의 firebaseConfig 를 그대로 붙여넣으세요.
  FIREBASE: {
    apiKey: "AIzaSyBMo_3AO7wcTgMIe6Sr_ZduWQUZOxajOuI",
    authDomain: "sl-homologation-schedule.firebaseapp.com",
    projectId: "sl-homologation-schedule",
    storageBucket: "sl-homologation-schedule.firebasestorage.app",
    messagingSenderId: "1039716423745",
    appId: "1:1039716423745:web:4cf78c30c6e43814e0cec0"
  },
  /* 예시)
  FIREBASE: {
    apiKey: "AIza....",
    authDomain: "eu-cert-schedule.firebaseapp.com",
    projectId: "eu-cert-schedule",
    storageBucket: "eu-cert-schedule.appspot.com",
    messagingSenderId: "1234567890",
    appId: "1:1234567890:web:abcdef"
  },
  */

  // 아이디만 입력하면 뒤에 붙는 이메일 도메인 (예: sud → sud@slcert.example)
  LOGIN_DOMAIN: "slcert.example",

  // 인증 담당자와 막대 색상 (PPT 범례와 동일)
  OWNERS: [
    { name: "김태석", bg: "#0a24ff", fg: "#ffffff" },
    { name: "송진우", bg: "#00b0f0", fg: "#000000" },
    { name: "최서웅", bg: "#ffff00", fg: "#000000" },
    { name: "심승협", bg: "#ffc000", fg: "#000000" },
    { name: "미정",   bg: "#d9d9d9", fg: "#000000" },
  ],

  // 인증기관. code 값은 Firebase users 문서의 agency 값과 같아야 합니다.
  AGENCIES: [
    { code: "SUD",       name: "TÜV SÜD",       prefix: "슈" },
    { code: "RHEINLAND", name: "TÜV Rheinland", prefix: "라" },
    { code: "ETC",       name: "기타",           prefix: "" },
  ],

  // 로그인 아이디(이메일 @ 앞부분) → 작업자 이름. 로그인하면 작업자가 자동으로 본인으로 설정됩니다.
  USER_NAMES: {
    "jinwoo.song": "송진우",
    "seunghyeop.shim": "심승협",
    "seowoong.choi": "최서웅",
    "taeseok.kim": "김태석",
    "woochul.noh": "노우철",
    "joonwoo.sohn": "손준우",
  },

  TYPES: ["신규", "EXT"],
  TRASH_DAYS: 7,
};

// 공휴일 (빨간 날 표시용, 대체공휴일 포함 — 필요 시 수정)
const HOLIDAYS = {
  "2026-01-01":"신정","2026-02-16":"설날","2026-02-17":"설날","2026-02-18":"설날","2026-03-01":"삼일절","2026-03-02":"대체공휴일",
  "2026-05-05":"어린이날","2026-05-24":"부처님오신날","2026-05-25":"대체공휴일","2026-06-03":"지방선거","2026-06-06":"현충일",
  "2026-08-15":"광복절","2026-08-17":"대체공휴일","2026-09-24":"추석","2026-09-25":"추석","2026-09-26":"추석",
  "2026-10-03":"개천절","2026-10-05":"대체공휴일","2026-10-09":"한글날","2026-12-25":"성탄절",
  "2027-01-01":"신정","2027-02-06":"설날","2027-02-07":"설날","2027-02-08":"설날","2027-02-09":"대체공휴일","2027-03-01":"삼일절",
  "2027-05-05":"어린이날","2027-05-13":"부처님오신날","2027-06-06":"현충일","2027-08-15":"광복절","2027-08-16":"대체공휴일",
  "2027-09-14":"추석","2027-09-15":"추석","2027-09-16":"추석","2027-10-03":"개천절","2027-10-04":"대체공휴일",
  "2027-10-09":"한글날","2027-10-11":"대체공휴일","2027-12-25":"성탄절","2027-12-27":"대체공휴일",
};

// 데모 모드 전용 샘플 데이터 (Firebase 모드에서는 사용하지 않음 — 배포 전 비워도 됩니다)
const DEMO = { schedules: [], blocks: [] };  // Firebase 연결 시 사용 안 함

/* =====================================================================
   2) 날짜 도우미
   ===================================================================== */
const pad = n => String(n).padStart(2,"0");
const fmt = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const dayDiff = (a,b) => Math.round((Date.UTC(b.getFullYear(),b.getMonth(),b.getDate())-Date.UTC(a.getFullYear(),a.getMonth(),a.getDate()))/864e5);
const short = s => { const d=parse(s); return `${d.getMonth()+1}/${d.getDate()}`; };
const nowIso = () => new Date().toISOString();
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = s => document.querySelector(s);

/* =====================================================================
   3) 데이터 저장소 — 데모(메모리) / Firebase
   ===================================================================== */
function DemoStore(){
  let seq = 1;
  const data = {
    schedules: DEMO.schedules.map(s=>({ id:"d"+seq++, deleted:false, deletedAt:null, ...s })),
    blocks: DEMO.blocks.map(b=>({ id:"b"+seq++, ...b })),
    history: [],
    comments: [],
  };
  const ne = data.schedules.find(x=>x.project==="NE1aW");
  if(ne) data.comments.push({ id:"c"+seq++, scheduleId:ne.id, agency:"RHEINLAND", authorUid:"demo-rheinland", authorRole:"agency",
    authorName:"TÜV Rheinland · Müller", text:"12/14 오전부터 시험 시작 가능합니다. 샘플은 12/11까지 도착 부탁드립니다.", at:new Date(Date.now()-864e5).toISOString() });
  let onUser=null, listener=null, user=null;
  const ROLES = {
    team:      { role:"admin" },
    sud:       { role:"agency", agency:"SUD" },
    rheinland: { role:"agency", agency:"RHEINLAND" },
  };
  // 서버가 권한에 맞는 데이터만 내려주는 것을 흉내냅니다.
  function emit(){
    if(!listener||!user) return;
    const sch = user.role==="admin" ? data.schedules : data.schedules.filter(s=>s.agency===user.agency && !s.deleted);
    const cm = user.role==="admin" ? data.comments : data.comments.filter(c=>c.agency===user.agency);
    listener({ schedules: sch.map(s=>({...s})), blocks: data.blocks.map(b=>({...b})), history: user.role==="admin" ? [...data.history] : [], comments: cm.map(c=>({...c})) });
  }
  return {
    mode:"demo",
    init(cb){ onUser=cb; cb(null); },
    async login(id){
      const r = ROLES[id.trim().toLowerCase()];
      if(!r) throw new Error("데모 아이디는 team / sud / rheinland 입니다.");
      user = { id:id.trim().toLowerCase(), uid:"demo-"+id.trim().toLowerCase(), ...r }; onUser(user);
    },
    async resetPw(){ throw new Error("데모 모드에서는 비밀번호 변경 메일을 보낼 수 없습니다."); },
    async logout(){ user=null; listener=null; onUser(null); },
    subscribe(cb){ listener=cb; emit(); },
    async add(o){ data.schedules.push({ id:"d"+seq++, ...o }); emit(); },
    async update(id,p){ const s=data.schedules.find(x=>x.id===id); Object.assign(s,p); emit(); },
    async remove(id){ data.schedules = data.schedules.filter(x=>x.id!==id); emit(); },
    async addBlock(b){ data.blocks.push({ id:"b"+seq++, ...b }); emit(); },
    async delBlock(id){ data.blocks = data.blocks.filter(x=>x.id!==id); emit(); },
    async log(h){ data.history.unshift({ id:"h"+seq++, ...h }); emit(); },
    async addComment(c){
      const s = data.schedules.find(x=>x.id===c.scheduleId);
      if(!s || (user.role!=="admin" && s.agency!==user.agency)) throw new Error("권한이 없습니다.");
      data.comments.push({ id:"c"+seq++, ...c }); emit();
    },
    async delComment(id){ data.comments = data.comments.filter(x=>x.id!==id); emit(); },
  };
}

async function FirebaseStore(cfg){
  const base = "https://www.gstatic.com/firebasejs/10.12.2/";
  const [{ initializeApp }, A, F] = await Promise.all([
    import(base+"firebase-app.js"), import(base+"firebase-auth.js"), import(base+"firebase-firestore.js"),
  ]);
  const app = initializeApp(cfg);
  const auth = A.getAuth(app);
  const db = F.getFirestore(app);
  let user=null, unsubs=[];
  const state = { schedules:[], blocks:[], history:[], comments:[] };
  const stop = () => { unsubs.forEach(u=>u()); unsubs=[]; };
  const fail = e => { console.error(e); alert("데이터를 불러오지 못했습니다: "+e.message); };

  return {
    mode:"firebase",
    init(cb){
      A.onAuthStateChanged(auth, async fu => {
        stop();
        if(!fu){ user=null; cb(null); return; }
        try{
          const snap = await F.getDoc(F.doc(db,"users",(fu.email||"").toLowerCase()));  // users 문서 ID = 로그인 이메일(소문자)
          if(!snap.exists()) throw new Error("권한이 등록되지 않은 계정입니다. 관리자에게 문의하세요.");
          const d = snap.data();
          user = { id: (fu.email||"").split("@")[0], uid:fu.uid, role:d.role, agency:d.agency||null };
          cb(user);
        }catch(e){ await A.signOut(auth); cb(null, e.message); }
      });
    },
    async login(id,pw){
      const email = id.includes("@") ? id.trim() : `${id.trim()}@${CONFIG.LOGIN_DOMAIN}`;
      try{ await A.signInWithEmailAndPassword(auth,email,pw); }
      catch(e){ const c=e.code||""; if(/invalid-credential|wrong-password|user-not-found|invalid-email/.test(c)) throw new Error("아이디 또는 비밀번호가 올바르지 않습니다."); if(/network-request-failed/.test(c)) throw new Error("서버에 연결할 수 없습니다. 회사 네트워크(방화벽)에서 googleapis.com 접속이 막혔을 수 있습니다. ("+c+")"); if(/too-many-requests/.test(c)) throw new Error("로그인 시도가 너무 많습니다. 잠시 후 다시 시도하세요."); throw new Error("로그인 오류: "+(c||e.message)); }
    },
    async resetPw(email){
      auth.languageCode = "ko";
      try{ await A.sendPasswordResetEmail(auth, email.trim()); }
      catch(e){ const c=e.code||""; if(/invalid-email|missing-email/.test(c)) throw new Error("이메일 주소 형식이 올바르지 않습니다."); if(/too-many-requests/.test(c)) throw new Error("요청이 너무 많습니다. 잠시 후 다시 시도하세요."); throw new Error("메일 발송 오류: "+(c||e.message)); }
    },
    async logout(){ stop(); await A.signOut(auth); },
    subscribe(cb){
      stop();
      const push = () => cb({ schedules:[...state.schedules], blocks:[...state.blocks], history:[...state.history], comments:[...state.comments] });
      const col = F.collection(db,"schedules");
      // 기관 계정은 자기 기관 + 삭제되지 않은 일정만 조회 (보안 규칙과 조건이 같아야 함)
      const q = user.role==="admin" ? col : F.query(col, F.where("agency","==",user.agency), F.where("deleted","==",false));
      unsubs.push(F.onSnapshot(q, s=>{ state.schedules = s.docs.map(d=>({ id:d.id, ...d.data() })); push(); }, fail));
      unsubs.push(F.onSnapshot(F.collection(db,"blocks"), s=>{ state.blocks = s.docs.map(d=>({ id:d.id, ...d.data() })); push(); }, fail));
      // 댓글: 관리자 전체, 기관은 자기 기관 일정의 댓글만 (보안 규칙과 조건이 같아야 함)
      const cc = F.collection(db,"comments");
      const cq = user.role==="admin" ? cc : F.query(cc, F.where("agency","==",user.agency));
      unsubs.push(F.onSnapshot(cq, s=>{ state.comments = s.docs.map(d=>({ id:d.id, ...d.data() })); push(); }, fail));
      if(user.role==="admin"){
        unsubs.push(F.onSnapshot(F.query(F.collection(db,"history"), F.orderBy("at","desc"), F.limit(300)),
          s=>{ state.history = s.docs.map(d=>({ id:d.id, ...d.data() })); push(); }, fail));
      }
    },
    add:      o      => F.addDoc(F.collection(db,"schedules"), o),
    update:   (id,p) => F.updateDoc(F.doc(db,"schedules",id), p),
    remove:   id     => F.deleteDoc(F.doc(db,"schedules",id)),
    addBlock: b      => F.addDoc(F.collection(db,"blocks"), b),
    delBlock: id     => F.deleteDoc(F.doc(db,"blocks",id)),
    log:      h      => F.addDoc(F.collection(db,"history"), h),
    addComment: c    => F.addDoc(F.collection(db,"comments"), c),
    delComment: id   => F.deleteDoc(F.doc(db,"comments",id)),
  };
}

const now = new Date();
const S = {
  store:null, user:null,
  schedules:[], blocks:[], history:[], comments:[], cname:"",
  y: now.getFullYear(), m: now.getMonth(), view:"month",
  f: { owner:new Set(), agency:new Set(), type:new Set() },
  worker: CONFIG.OWNERS[0].name, purged:false,
};
const isAdmin = () => S.user && S.user.role==="admin";
const ownerOf = n => CONFIG.OWNERS.find(o=>o.name===n) || { name:n||"-", bg:"#cfd5de", fg:"#000" };
const agencyOf = c => CONFIG.AGENCIES.find(a=>a.code===c) || { code:c, name:c||"-", prefix:"" };
const barText = s => { const p=agencyOf(s.agency).prefix; return `${p?p+" : ":""}${s.project} ${s.part||""}`.trim(); };

function visible(){
  return S.schedules.filter(s => !s.deleted
    && (!S.f.owner.size  || S.f.owner.has(s.owner))
    && (!S.f.agency.size || S.f.agency.has(s.agency))
    && (!S.f.type.size   || S.f.type.has(s.type)));
}

function render(){
  const yy = String(S.y).slice(2);

  $("#viewList").classList.toggle("hidden", S.view!=="list");

function renderFilters(){
  const chipOn = (set,v) => !set.size || set.has(v);
  let h = `<div class="fgroup"><span>인증담당자:</span>` + CONFIG.OWNERS.map(o =>
    `<button class="chip ${chipOn(S.f.owner,o.name)?"":"off"}" data-f="owner" data-v="${esc(o.name)}" style="background:${o.bg};color:${o.fg}">${esc(o.name)}</button>`).join("") + `</div>`;
  if(isAdmin()){
    h += `<div class="fgroup"><span>기관:</span>` + CONFIG.AGENCIES.map(a =>
      `<button class="chip plain ${S.f.agency.has(a.code)?"on":""} ${chipOn(S.f.agency,a.code)?"":"off"}" data-f="agency" data-v="${a.code}">${esc(a.name)}</button>`).join("") + `</div>`;
  }
  h += `<div class="fgroup"><span>구분:</span>` + CONFIG.TYPES.map(t =>
    `<button class="chip plain ${S.f.type.has(t)?"on":""} ${chipOn(S.f.type,t)?"":"off"}" data-f="type" data-v="${t}">${t}</button>`).join("") + `</div>`;
  if(S.f.owner.size||S.f.agency.size||S.f.type.size) h += `<button class="reset" id="resetF">필터 해제</button>`;
  $("#filters").innerHTML = h;
}

function renderMonth(){
  const first = new Date(S.y,S.m,1), last = new Date(S.y,S.m+1,0);
  const start = addDays(first,-first.getDay()), end = addDays(last,6-last.getDay());
  const weeks = (dayDiff(start,end)+1)/7;
  const todayStr = fmt(new Date());
  const list = visible();

  // 휴무 블록 날짜표
  const blockMap = {};
  S.blocks.forEach(b => { for(let d=parse(b.start); fmt(d)<=b.end; d=addDays(d,1)) blockMap[fmt(d)] = { label:b.label, first: fmt(d)===b.start }; });

  let h = `<div class="dow">${["일","월","화","수","목","금","토"].map((d,i)=>`<div class="${i===0?"s":i===6?"t":""}">${d}</div>`).join("")}</div>`;

  for(let w=0; w<weeks; w++){
    const ws = addDays(start,w*7), we = addDays(ws,6);
    const wsS = fmt(ws), weS = fmt(we);

    // 이 주에 걸친 일정 → 줄(lane) 배치
    const evs = list.filter(s => s.start<=weS && s.end>=wsS)
      .sort((a,b)=> a.start.localeCompare(b.start) || b.end.localeCompare(a.end) || barText(a).localeCompare(barText(b)));
    const lanes = []; const placed = [];
    evs.forEach(s => {
      const sc = s.start<wsS ? 0 : dayDiff(ws,parse(s.start));
      const ec = s.end>weS ? 6 : dayDiff(ws,parse(s.end));
      let l = lanes.findIndex(lastEnd => lastEnd < sc);
      if(l<0){ l = lanes.length; lanes.push(ec); } else lanes[l] = ec;
      placed.push({ s, sc, ec, l, cl: s.start<wsS, cr: s.end>weS });
    });

    h += `<div class="week" data-ws="${wsS}" style="grid-template-rows:30px ${lanes.length?`repeat(${lanes.length},22px) `:""}1fr">`;
    for(let i=0;i<7;i++){
      const d = addDays(ws,i), ds = fmt(d), out = d.getMonth()!==S.m;
      const hol = HOLIDAYS[ds], blk = blockMap[ds];
      const cls = ["cell", isAdmin()?"admin":"", out?"out":"", i===0?"sun":"", i===6?"sat":"", hol?"hol":"", ds===todayStr?"today":"", blk?"blocked":""].join(" ");
      const label = (out || d.getDate()===1 && d.getMonth()!==S.m) ? `${d.getMonth()+1}/${d.getDate()}` : d.getDate();
      h += `<div class="${cls}" data-date="${ds}" style="grid-column:${i+1}">
        <span class="dnum">${label}</span>${hol?`<span class="hname">${esc(hol)}</span>`:""}
        ${blk && (blk.first || i===0) ? `<span class="blabel">${esc(blk.label||"휴무")}</span>` : ""}</div>`;
    }
    placed.forEach(p => {
      const o = ownerOf(p.s.owner);
      h += `<div class="bar ${p.cl?"cl":""} ${p.cr?"cr":""}" data-id="${p.s.id}" title="${esc(barText(p.s))} (${short(p.s.start)}~${short(p.s.end)}) · ${esc(p.s.owner)} · ${esc(p.s.type)}"
        style="grid-column:${p.sc+1}/span ${p.ec-p.sc+1};grid-row:${p.l+2};background:${o.bg};color:${o.fg}">
        <span class="tb">${esc(p.s.type)}</span>${esc(barText(p.s))}${ccount(p.s.id)?`<span class="cc">댓글 ${ccount(p.s.id)}</span>`:""}</div>`;
    });
    h += `</div>`;
  }
  $("#cal").innerHTML = h;
}

function renderList(){
  const mS = fmt(new Date(S.y,S.m,1)), mE = fmt(new Date(S.y,S.m+1,0));
  const rows = visible().filter(s=>s.start<=mE && s.end>=mS).sort((a,b)=>a.start.localeCompare(b.start));
  if(!rows.length){ $("#viewList").innerHTML = `<div class="empty">이 달에 등록된 일정이 없습니다.</div>`; return; }
  $("#viewList").innerHTML = `<table class="list"><thead><tr>
      <th>기간</th><th>기관</th><th>프로젝트</th><th>부품</th><th>구분</th><th>담당자</th><th>비고</th></tr></thead><tbody>` +
    rows.map(s => { const o=ownerOf(s.owner); return `<tr class="click" data-id="${s.id}">
      <td>${short(s.start)}${s.end!==s.start?" ~ "+short(s.end):""}</td><td>${esc(agencyOf(s.agency).name)}</td>
      <td>${esc(s.project)}</td><td>${esc(s.part)}</td><td>${esc(s.type)}</td>
      <td><span class="dot" style="background:${o.bg}"></span>${esc(s.owner)}</td><td>${esc(s.note)}</td></tr>`; }).join("") +
    `</tbody></table>`;
}

function modal(html, wide){
  S.redraw = null;
  $("#modalRoot").innerHTML = `<div class="overlay"><div class="modal ${wide?"wide":""}">${html}</div></div>`;
  const ov = $("#modalRoot .overlay");
  ov.addEventListener("mousedown", e => { if(e.target===ov) closeModal(); });
  return ov;
}
const closeModal = () => { $("#modalRoot").innerHTML = ""; S.redraw = null; };
document.addEventListener("keydown", e => { if(e.key==="Escape") closeModal(); });

const ccount = id => S.comments.filter(c=>c.scheduleId===id).length;
const isNew = at => Date.now() - new Date(at).getTime() < 3*864e5;
const stamp = at => { const d=new Date(at); return `${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
function loadName(){ try{ return localStorage.getItem("cert-cname")||""; }catch(e){ return ""; } }
function saveName(v){ try{ localStorage.setItem("cert-cname",v); }catch(e){} }

function openDetail(id){

    const list = S.comments.filter(c=>c.scheduleId===id).sort((a,b)=>a.at.localeCompare(b.at));

      const mine = isAdmin() || c.authorUid===S.user.uid;
      return `<div class="cmt ${c.authorRole==="agency"?"ext":""}"><div class="meta"><b>${esc(c.authorName)}</b><span>${stamp(c.at)}</span>
        ${isNew(c.at)?`<span class="newtag">NEW</span>`:""}${mine?`<button data-cdel="${c.id}">삭제</button>`:""}</div>
        <div class="body">${esc(c.text)}</div></div>`;
    }).join("");
    const defName = isAdmin() ? S.worker : (S.cname || loadName());
    modal(`<h3>${esc(barText(s))}</h3>
      <dl class="kv">
        <dt>기간</dt><dd>${s.start} ~ ${s.end}</dd>
        <dt>인증기관</dt><dd>${esc(agencyOf(s.agency).name)}</dd>
        <dt>구분</dt><dd>${esc(s.type)}</dd>
        <dt>담당자</dt><dd>${esc(s.owner)}</dd>
        <dt>비고</dt><dd>${esc(s.note)||"-"}</dd>
      </dl>
      <div class="thread">
        <h4>댓글 ${list.length}</h4>
        ${cm || `<div class="small" style="margin-bottom:8px">아직 댓글이 없습니다.</div>`}
        <div class="cform">
          <input id="cName" placeholder="이름" value="${esc(defName)}" ${isAdmin()?"readonly":""} maxlength="40">
          <textarea id="cText" placeholder="일정 문의, 샘플 도착 등 남길 내용" maxlength="1000">${esc(keepText)}</textarea>
          <button class="btn" id="cSend">등록</button>
        </div>
        <div class="err" id="cErr"></div>
        <div class="small">${isAdmin()?`이 일정의 댓글은 ${esc(agencyOf(s.agency).name)} 계정에도 보입니다.`:"우리 팀 담당자와 귀 기관만 볼 수 있습니다."}</div>
      </div>
      <div class="mfoot">
        <button class="btn ghost" data-close>닫기</button>
        ${isAdmin()?`<button class="btn" id="dEdit">일정 수정</button>`:""}
      </div>`);
    $("[data-close]").onclick = closeModal;
    if(isAdmin()) $("#dEdit").onclick = () => openEdit(id);
    $("#cSend").onclick = async () => {
      const name = $("#cName").value.trim(), text = $("#cText").value.trim();
      if(!name){ $("#cErr").textContent = "이름을 입력하세요."; return; }
      if(!text){ $("#cErr").textContent = "내용을 입력하세요."; return; }
      if(!isAdmin()){ S.cname = name; saveName(name); }
      const authorName = isAdmin() ? `${name} (SL)` : `${agencyOf(S.user.agency).name} · ${name}`;
      $("#cSend").disabled = true;
      try{
        await S.store.addComment({ scheduleId:id, agency:s.agency, authorUid:S.user.uid, authorRole:S.user.role,
          authorName, text, at:nowIso() });
        draw();
      }catch(e){ $("#cErr").textContent = "등록 실패: "+e.message; $("#cSend").disabled = false; }
    };
    document.querySelectorAll("[data-cdel]").forEach(b => b.onclick = async () => {

      await S.store.delComment(b.dataset.cdel);
    });
    S.redraw = () => draw($("#cText") ? $("#cText").value : "");
  };
  draw();

      <div><label>구분</label><select name="type">${opt(CONFIG.TYPES,v.type)}</select></div>

      <div class="full"><label>비고 <span class="small">(해당 인증기관 계정에도 보입니다)</span></label><textarea name="note">${esc(v.note)}</textarea></div>
    </form>
    <div class="err" id="efErr"></div>
    <div class="mfoot">
      ${s?`<button class="btn danger left" id="efDel">삭제</button>`:""}
      <button class="btn ghost" data-close>취소</button>
      <button class="btn" id="efSave">저장</button>
    </div>`);
  $("[data-close]").onclick = closeModal;
  $("#ef [name=project]").focus();
  $("#efSave").onclick = async () => {
    const fd = Object.fromEntries(new FormData($("#ef")));
    Object.keys(fd).forEach(k=>fd[k]=fd[k].trim());
    if(!fd.project){ $("#efErr").textContent="프로젝트를 입력하세요."; return; }

    const meta = { updatedBy:S.worker, updatedAt:nowIso() };
    try{
      if(s){ await S.store.update(s.id, { ...fd, ...meta }); await log("수정", { ...s, ...fd }); }
      else { await S.store.add({ ...fd, deleted:false, deletedAt:null, createdBy:S.worker, ...meta }); await log("등록", fd); }
      closeModal();
    }catch(e){ $("#efErr").textContent = "저장 실패: "+e.message; }
  };

    await S.store.update(s.id, { deleted:true, deletedAt:nowIso(), updatedBy:S.worker, updatedAt:nowIso() });
    await log("삭제", s); closeModal();
  };
}

function openBlocks(){
  const draw = () => {
    const rows = [...S.blocks].sort((a,b)=>a.start.localeCompare(b.start)).map(b =>
      `<tr><td>${b.start} ~ ${b.end}</td><td>${esc(b.label)}</td><td style="text-align:right"><button class="btn danger sm" data-del="${b.id}">삭제</button></td></tr>`).join("");
    modal(`<h3>휴무 / 블록 관리</h3>
      <p class="small" style="margin-top:-6px">회사 휴무, 시험 불가 기간 등을 초록색으로 표시합니다. 모든 계정에 보입니다.</p>
      <form id="bf" class="form">
        <div><label>시작일</label><input type="date" name="start" required></div>
        <div><label>종료일</label><input type="date" name="end" required></div>
        <div class="full"><label>표시 문구</label><input name="label" value="휴무"></div>
      </form>
      <div class="mfoot" style="margin-top:10px"><button class="btn sm" id="bAdd">추가</button></div>
      <table class="list" style="margin-top:12px"><thead><tr><th>기간</th><th>문구</th><th></th></tr></thead>
      <tbody>${rows||`<tr><td colspan="3" class="empty">등록된 휴무가 없습니다.</td></tr>`}</tbody></table>
      <div class="mfoot"><button class="btn ghost" data-close>닫기</button></div>`);
    $("[data-close]").onclick = closeModal;
    $("#bAdd").onclick = async () => {
      const fd = Object.fromEntries(new FormData($("#bf")));
      if(!fd.start||!fd.end||fd.start>fd.end){ alert("기간을 확인하세요."); return; }
      await S.store.addBlock({ start:fd.start, end:fd.end, label:fd.label.trim()||"휴무" });
      await log("휴무 등록", { project:fd.label||"휴무", part:"", start:fd.start, end:fd.end }); draw();
    };
    document.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
      const blk = S.blocks.find(x=>x.id===b.dataset.del);
      await S.store.delBlock(b.dataset.del);
      await log("휴무 삭제", { project:blk.label, part:"", start:blk.start, end:blk.end }); draw();
    });
  };
  draw();
}

function openTrash(){
  const draw = () => {
    const del = S.schedules.filter(s=>s.deleted).sort((a,b)=>(b.deletedAt||"").localeCompare(a.deletedAt||""));
    const rows = del.map(s => {
      const left = Math.max(0, CONFIG.TRASH_DAYS - Math.floor((Date.now()-new Date(s.deletedAt))/864e5));
      return `<tr><td>${esc(barText(s))}</td><td>${short(s.start)}~${short(s.end)}</td><td>${esc(s.updatedBy||"")}</td><td>${left}일 남음</td>
        <td style="text-align:right;white-space:nowrap"><button class="btn sm" data-r="${s.id}">복구</button> <button class="btn danger sm" data-p="${s.id}">영구삭제</button></td></tr>`;
    }).join("");
    modal(`<h3>휴지통</h3><p class="small" style="margin-top:-6px">삭제한 일정은 ${CONFIG.TRASH_DAYS}일 뒤 자동으로 영구 삭제됩니다.</p>
      <table class="list"><thead><tr><th>일정</th><th>기간</th><th>삭제자</th><th>보관</th><th></th></tr></thead>
      <tbody>${rows||`<tr><td colspan="5" class="empty">휴지통이 비어 있습니다.</td></tr>`}</tbody></table>
      <div class="mfoot"><button class="btn ghost" data-close>닫기</button></div>`, true);
    $("[data-close]").onclick = closeModal;
    document.querySelectorAll("[data-r]").forEach(b => b.onclick = async () => {
      const s = S.schedules.find(x=>x.id===b.dataset.r);
      await S.store.update(s.id, { deleted:false, deletedAt:null, updatedBy:S.worker, updatedAt:nowIso() });
      await log("복구", s); draw();
    });
    document.querySelectorAll("[data-p]").forEach(b => b.onclick = async () => {
      const s = S.schedules.find(x=>x.id===b.dataset.p);
      if(!confirm("영구 삭제하면 되돌릴 수 없습니다. 계속할까요?")) return;
      await S.store.remove(s.id); await log("영구삭제", s); draw();
    });
  };
  draw();
}

function openHistory(){
  const rows = S.history.map(h => {
    const d = new Date(h.at);
    return `<tr><td style="white-space:nowrap">${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}</td>
      <td>${esc(h.by)}</td><td>${esc(h.action)}</td><td>${esc(h.summary)}</td></tr>`;
  }).join("");
  modal(`<h3>변경 이력</h3>
    <table class="list"><thead><tr><th>시각</th><th>작업자</th><th>작업</th><th>내용</th></tr></thead>
    <tbody>${rows||`<tr><td colspan="4" class="empty">기록이 없습니다.</td></tr>`}</tbody></table>
    <div class="mfoot"><button class="btn ghost" data-close>닫기</button></div>`, true);
  $("[data-close]").onclick = closeModal;
}

function log(action, s){
  const summary = `${s.agency?agencyOf(s.agency).prefix+" ":""}${s.project||""} ${s.part||""} (${short(s.start)}~${short(s.end)})${s.owner?" · "+s.owner:""}`.replace(/\s+/g," ").trim();
  return S.store.log({ at:nowIso(), by:S.worker, action, summary });
}

/* =====================================================================
   7) 이벤트
   ===================================================================== */
$("#prev").onclick  = () => { S.m--; if(S.m<0){S.m=11;S.y--;} render(); };
$("#next").onclick  = () => { S.m++; if(S.m>11){S.m=0;S.y++;} render(); };
$("#today").onclick = () => { const d=new Date(); S.y=d.getFullYear(); S.m=d.getMonth(); render(); };
document.querySelectorAll(".view-toggle button").forEach(b => b.onclick = () => {
  S.view = b.dataset.view;
  document.querySelectorAll(".view-toggle button").forEach(x=>x.classList.toggle("on",x===b));
  render();
});
$("#filters").addEventListener("click", e => {
  if(e.target.id==="resetF"){ Object.values(S.f).forEach(s=>s.clear()); render(); return; }
  const c = e.target.closest("[data-f]"); if(!c) return;
  const set = S.f[c.dataset.f], v = c.dataset.v;
  set.has(v) ? set.delete(v) : set.add(v);
  render();
});
$("#btnAdd").onclick     = () => openEdit(null);
$("#btnBlocks").onclick  = openBlocks;
$("#btnTrash").onclick   = openTrash;
$("#btnHistory").onclick = openHistory;
$("#btnComments").onclick = openComments;
$("#btnPrint").onclick   = () => window.print();
$("#btnLogout").onclick  = () => S.store.logout();
$("#worker").onchange    = e => { S.worker = e.target.value; };
$("#viewList").addEventListener("click", e => {
  const r = e.target.closest("tr[data-id]"); if(!r) return;
  openDetail(r.dataset.id);
});

// 달력: 막대 클릭 = 수정/상세, 빈 칸 클릭·드래그 = 새 일정
let drag = null;
const cal = $("#cal");
cal.addEventListener("click", e => {
  const b = e.target.closest(".bar"); if(!b) return;
  openDetail(b.dataset.id);
});
function dateAt(x,y){
  const el = document.elementFromPoint(x,y); if(!el) return null;
  const c = el.closest(".cell"); if(c) return c.dataset.date;
  const w = el.closest(".week"); if(!w) return null;
  const r = w.getBoundingClientRect();
  const col = Math.min(6, Math.max(0, Math.floor((x-r.left)/(r.width/7))));
  return fmt(addDays(parse(w.dataset.ws), col));
}
function paintSel(){
  const [a,b] = drag ? [drag.a,drag.b].sort() : [null,null];
  cal.querySelectorAll(".cell").forEach(c => c.classList.toggle("sel", !!drag && c.dataset.date>=a && c.dataset.date<=b));
}
cal.addEventListener("pointerdown", e => {
  if(!isAdmin() || e.button!==0 || e.target.closest(".bar")) return;
  const c = e.target.closest(".cell"); if(!c) return;
  drag = { a:c.dataset.date, b:c.dataset.date }; paintSel();
});
document.addEventListener("pointermove", e => {
  if(!drag) return;
  const d = dateAt(e.clientX,e.clientY);
  if(d && d!==drag.b){ drag.b = d; paintSel(); }
});
document.addEventListener("pointerup", () => {
  if(!drag) return;
  const [a,b] = [drag.a,drag.b].sort(); drag = null; paintSel();
  openEdit(null, { start:a, end:b });
});

// 로그인
$("#loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  $("#loginErr").textContent = ""; $("#loginBtn").disabled = true;
  try{ await S.store.login($("#lid").value, $("#lpw").value); }
  catch(err){ $("#loginErr").textContent = err.message; }
  finally{ $("#loginBtn").disabled = false; }
});
$("#forgotPw").addEventListener("click", async e => {
  e.preventDefault();
  const id = $("#lid").value.trim();
  if(!id.includes("@")){ $("#loginErr").textContent = "아이디 칸에 로그인 이메일 주소를 입력한 뒤 다시 누르세요."; $("#lid").focus(); return; }
  if(!confirm(id+" 로 비밀번호 변경 메일을 보낼까요?")) return;
  $("#loginErr").textContent = "";
  try{ await S.store.resetPw(id); $("#loginErr").style.color = "var(--accent)"; $("#loginErr").textContent = "등록된 계정이면 "+id+" 로 비밀번호 변경 메일이 발송됩니다. 메일의 링크에서 새 비밀번호를 정하세요. (스팸함도 확인)"; }
  catch(err){ $("#loginErr").style.color = ""; $("#loginErr").textContent = err.message; }
});
$("#lid").addEventListener("input", () => { $("#loginErr").style.color = ""; });

/* =====================================================================
   8) 시작
   ===================================================================== */
function onUser(user, err){
  S.user = user; closeModal();
  if(!user){
    $("#app").classList.add("hidden"); $("#login").classList.remove("hidden");
    $("#lpw").value = ""; $("#loginErr").textContent = err || "";
    return;
  }
  $("#login").classList.add("hidden"); $("#app").classList.remove("hidden");
  $("#whoLabel").textContent = isAdmin() ? "우리팀 (관리자)" : `${agencyOf(user.agency).name} (조회 · 댓글)`;
  document.querySelectorAll(".admin-only").forEach(el => el.classList.toggle("hidden", !isAdmin()));
  $("#workerWrap").classList.toggle("hidden", !isAdmin());
  const myName = (CONFIG.USER_NAMES||{})[(user.id||"").toLowerCase()];
  if(myName){
    if(![...$("#worker").options].some(o=>o.value===myName)) $("#worker").insertAdjacentHTML("beforeend", `<option>${esc(myName)}</option>`);
    S.worker = myName; $("#worker").value = myName;
  }
  Object.values(S.f).forEach(s=>s.clear());
  S.schedules=[]; S.blocks=[]; S.history=[]; S.comments=[]; S.purged=false;
  render();
  S.store.subscribe(onData);
}

function onData(d){
  S.schedules = d.schedules; S.blocks = d.blocks; S.history = d.history; S.comments = d.comments || [];
  // 관리자 접속 시 보관기간 지난 휴지통 항목 정리
  if(isAdmin() && !S.purged){
    S.purged = true;
    const limit = Date.now() - CONFIG.TRASH_DAYS*864e5;
    S.schedules.filter(s=>s.deleted && s.deletedAt && new Date(s.deletedAt).getTime()<limit).forEach(s=>S.store.remove(s.id));
  }
  render();
  if(S.redraw) S.redraw();
}

(async function start(){
  $("#worker").innerHTML = CONFIG.OWNERS.filter(o=>o.name!=="미정").map(o=>`<option>${esc(o.name)}</option>`).join("");
  try{
    S.store = CONFIG.FIREBASE ? await FirebaseStore(CONFIG.FIREBASE) : DemoStore();
  }catch(e){
    alert("Firebase를 불러오지 못했습니다. 회사 네트워크(방화벽)에서 gstatic.com / googleapis.com 접속이 막혔는지 확인하세요.\n"+e.message);
    return;
  }
  if(S.store.mode==="demo"){ $("#demoHint").classList.remove("hidden"); $("#modeBadge").classList.remove("hidden"); }
  S.store.init(onUser);
})();
</script>
